<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chứa Mã Nguồn Thô (<textarea>)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        textarea.code-box {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.85rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            resize: vertical;
            white-space: pre;
        }
    </style>
</head>
<body class="py-4">

    <div class="container" style="max-width: 1000px;">
        <div class="card shadow-sm border-0 p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="fw-bold text-dark mb-0"><i class="fa-solid fa-code text-primary me-2"></i>Mã nguồn HTML nguyên văn</h5>
                <button class="btn btn-outline-primary btn-sm" onclick="copyRawCode()">
                    <i class="fa-solid fa-copy me-1"></i> Sao chép toàn bộ mã
                </button>
            </div>
            
            <!-- Thẻ textarea hiển thị nguyên văn dạng văn bản thuần túy -->
            <textarea id="rawCodeArea" class="form-control code-box" rows="22" placeholder="Dán mã HTML của bạn vào đây..."><!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ mã nguồn thô</title>
</head>
<body>
    <h1>Xin chào Nguyễn Cao Mẫn!</h1>
</body>
</html>
